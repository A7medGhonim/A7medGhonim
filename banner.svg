<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ahmed Ghonim - Junior Data Analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2447"/>
      <stop offset="1" stop-color="#1b56b8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#7ee0ff"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7e67"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .fade{opacity:0;animation:fade .9s ease forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes grow{to{transform:scaleY(1)}}
    .line{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 2s ease 1s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .dot{opacity:0;animation:fade .4s ease forwards, pulse 2s ease-in-out 3s infinite}
    @keyframes pulse{50%{opacity:.5}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <circle cx="930" cy="30" r="150" fill="#ffffff" opacity="0.04"/>
    <circle cx="40" cy="270" r="120" fill="#ffffff" opacity="0.04"/>

    <!-- grid -->
    <g stroke="#ffffff" opacity="0.08">
      <line x1="590" y1="60" x2="940" y2="60"/>
      <line x1="590" y1="100" x2="940" y2="100"/>
      <line x1="590" y1="140" x2="940" y2="140"/>
      <line x1="590" y1="180" x2="940" y2="180"/>
      <line x1="590" y1="220" x2="940" y2="220"/>
    </g>

    <!-- bars -->
    <g>
      <rect class="b" x="610" y="170" width="28" height="50" rx="5" fill="url(#bar)" style="animation-delay:.3s"/>
      <rect class="b" x="655" y="140" width="28" height="80" rx="5" fill="url(#bar)" style="animation-delay:.4s"/>
      <rect class="b" x="700" y="155" width="28" height="65" rx="5" fill="url(#bar)" style="animation-delay:.5s"/>
      <rect class="b" x="745" y="110" width="28" height="110" rx="5" fill="url(#bar)" style="animation-delay:.6s"/>
      <rect class="b" x="790" y="125" width="28" height="95" rx="5" fill="url(#bar)" style="animation-delay:.7s"/>
      <rect class="b" x="835" y="80" width="28" height="140" rx="5" fill="url(#bar)" style="animation-delay:.8s"/>
      <rect class="b" x="880" y="60" width="28" height="160" rx="5" fill="url(#bar)" style="animation-delay:.9s"/>
    </g>

    <!-- trend line -->
    <path class="line" d="M624 150 L669 120 L714 135 L759 90 L804 105 L849 62 L894 42" fill="none" stroke="url(#ln)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffd166">
      <circle class="dot" cx="759" cy="90" r="5" style="animation-delay:1.8s,3s"/>
      <circle class="dot" cx="849" cy="62" r="5" style="animation-delay:2.2s,3s"/>
      <circle class="dot" cx="894" cy="42" r="6" style="animation-delay:2.6s,3s"/>
    </g>

    <!-- text -->
    <text class="t fade d2" x="60" y="140" font-size="58" font-weight="800" fill="#ffffff">Ahmed Ghonim</text>
    <text class="t fade d3" x="60" y="184" font-size="26" fill="#cfe3ff">Junior Data Analyst</text>
    <text class="t fade d4" x="60" y="228" font-size="16" fill="#9db4d6">Python  ·  SQL  ·  Power BI  ·  Tableau  ·  Excel</text>
  </g>
</svg>
